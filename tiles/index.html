<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Editor de Marcadores - Mapa Interativo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    /* Seu CSS existente - mantenha tudo igual */
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
    #map { width: 100%; height: 100%; }
    
    .control-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      padding: 10px 15px;
      border-radius: 40px;
      color: white;
      font-size: 12px;
      border: 1px solid #d4af37;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      font-family: monospace;
    }
    
    .capture-btn {
      position: absolute;
      bottom: 100px;
      right: 12px;
      z-index: 1000;
      background: #d4af37;
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .save-btn {
      position: absolute;
      bottom: 160px;
      right: 12px;
      z-index: 1000;
      background: #4caf50;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .load-btn {
      position: absolute;
      bottom: 220px;
      right: 12px;
      z-index: 1000;
      background: #2196f3;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .btn-back {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 999;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
    }
    
    .points-list {
      position: absolute;
      top: 70px;
      left: 12px;
      z-index: 1000;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      border-radius: 12px;
      width: 300px;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #d4af37;
    }
    
    .points-header {
      padding: 10px;
      background: rgba(212, 175, 55, 0.2);
      border-bottom: 1px solid #d4af37;
      font-weight: bold;
      color: #d4af37;
      text-align: center;
      position: sticky;
      top: 0;
    }
    
    .point-item {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: 0.2s;
    }
    
    .point-item:hover {
      background: rgba(212, 175, 55, 0.2);
    }
    
    .point-name {
      color: #d4af37;
      font-weight: bold;
      font-size: 13px;
    }
    
    .point-coords {
      color: #aaa;
      font-size: 10px;
      margin-top: 3px;
      font-family: monospace;
    }
    
    .point-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .edit-point, .delete-point, .drag-point, .duplicate-point {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }
    
    .edit-point { background: #2196f3; color: white; }
    .delete-point { background: #e91e63; color: white; }
    .drag-point { background: #ff9800; color: white; }
    .duplicate-point { background: #9c27b0; color: white; }
    
    .drag-point.ativo {
      background: #ff5722;
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(20px);
      padding: 20px;
      border-radius: 15px;
      z-index: 2000;
      width: 90%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
      border: 2px solid #d4af37;
    }
    
    .modal h3 {
      color: #d4af37;
      margin: 0 0 15px 0;
    }
    
    .modal input, .modal textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
      border-radius: 8px;
      border: 1px solid #d4af37;
      background: #222;
      color: white;
      font-size: 14px;
    }
    
    .modal label {
      color: #d4af37;
      font-weight: bold;
      font-size: 12px;
    }
    
    .modal button {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }
    
    .coord-info {
      background: rgba(212, 175, 55, 0.2);
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
      font-family: monospace;
      font-size: 12px;
    }
    
    .images-section, .buttons-section {
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .add-btn {
      background: #4caf50;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
    }
    
    .image-input-group, .button-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .image-input-group input, .button-input-group input {
      flex: 1;
      margin: 0;
    }
    
    .button-input-group input:first-child {
      flex: 0.8;
    }
    
    .button-input-group input:last-child {
      flex: 1.2;
    }
    
    .remove-image-btn, .remove-button-btn {
      background: #e91e63;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
    }
    
    .image-preview, .button-preview {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .image-preview img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #d4af37;
    }
    
    .button-preview .preview-btn {
      background: rgba(212, 175, 55, 0.2);
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    
    .file-input {
      display: none;
    }
    
    .notification {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      color: #d4af37;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      z-index: 2000;
      border: 2px solid #d4af37;
      animation: fadeOut 2s forwards;
      font-family: monospace;
      white-space: pre-line;
    }
    
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    
    @media (max-width: 600px) {
      .capture-btn, .save-btn, .load-btn { padding: 8px 14px; font-size: 11px; }
      .capture-btn { bottom: 80px; }
      .save-btn { bottom: 130px; }
      .load-btn { bottom: 180px; }
      .points-list { width: 280px; max-height: 350px; top: 60px; left: 8px; }
      .control-panel { font-size: 9px; white-space: normal; width: 85%; text-align: center; }
      .modal { width: 95%; padding: 15px; }
      .button-input-group { flex-direction: column; }
      .button-input-group input { width: 100%; }
    }
  </style>
</head>
<body>

<button class="btn-back" onclick="goBack()">← Voltar</button>
<div id="map"></div>
<div class="control-panel" id="controlPanel">📍 Carregando configurações do mapa...</div>

<button class="capture-btn" id="captureBtn">🎯 ATIVAR CAPTURA</button>
<button class="save-btn" id="saveBtn">💾 SALVAR XML</button>
<button class="load-btn" id="loadBtn">📂 CARREGAR XML</button>
<input type="file" id="fileInput" class="file-input" accept=".xml">

<div class="points-list" id="pointsList" style="display: none;">
  <div class="points-header">📍 PONTOS CADASTRADOS</div>
  <div id="pointsContainer"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let modoCaptura = false;
let modoDrag = false;
let pontoEmEdicao = null;
let marcadorTemp = null;
let pontos = [];
let editandoId = null;
let mapMarkers = {};
let dragMarker = null;
let imagensTemp = [];
let botoesTemp = [];
let mapInstance = null;
let bounds = null;
let configTiles = null;

function goBack() { window.location.href = "view.html"; }

function showNotification(msg) {
  const notif = document.createElement('div');
  notif.className = 'notification';
  notif.innerHTML = msg;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 2500);
}

async function carregarConfiguracoes() {
  try {
    const response = await fetch('../tiles/tiles.xml');
    if (!response.ok) throw new Error('tiles.xml não encontrado');
    const xmlText = await response.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, 'application/xml');
    
    configTiles = {
      tileSize: parseInt(xml.querySelector('tileSize')?.textContent || 256),
      originalWidth: parseInt(xml.querySelector('originalWidth')?.textContent || 5938),
      originalHeight: parseInt(xml.querySelector('originalHeight')?.textContent || 3677),
      maxZoom: parseInt(xml.querySelector('maxZoom')?.textContent || 3)
    };
    
    console.log('✅ Configurações carregadas:', configTiles);
    return configTiles;
  } catch (erro) {
    console.log('⚠️ tiles.xml não encontrado, usando configurações padrão');
    configTiles = {
      tileSize: 256,
      originalWidth: 5938,
      originalHeight: 3677,
      maxZoom: 3
    };
    return configTiles;
  }
}

async function inicializarMapa() {
  const config = await carregarConfiguracoes();
  
  const WIDTH = config.originalWidth;
  const HEIGHT = config.originalHeight;
  const maxZoom = config.maxZoom;
  
  mapInstance = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: 0,
    maxZoom: maxZoom,
    zoomSnap: 0.25,
    zoomDelta: 0.5,
    zoomControl: true,
    inertia: true,
    inertiaDeceleration: 3000
  });
  
  const southWest = mapInstance.unproject([0, HEIGHT], maxZoom);
  const northEast = mapInstance.unproject([WIDTH, 0], maxZoom);
  bounds = new L.LatLngBounds(southWest, northEast);
  
  L.tileLayer('../tiles/{z}/{x}/{y}.webp', {
    tileSize: config.tileSize,
    minZoom: 0,
    maxZoom: maxZoom,
    noWrap: true,
    bounds: bounds
  }).addTo(mapInstance);
  
  mapInstance.fitBounds(bounds);
  mapInstance.setMaxBounds(bounds);
  
  document.getElementById('controlPanel').innerHTML = '📍 Clique em ATIVAR CAPTURA e depois no mapa';
  
  console.log(`✅ Mapa inicializado: ${WIDTH}x${HEIGHT}, Zoom max: ${maxZoom}, Tile: ${config.tileSize}`);
  
  configurarEventosMapa();
  carregarMarcadoresSalvos();
}

function configurarEventosMapa() {
  mapInstance.on('click', async function(e) {
    if (modoDrag) {
      cancelarDrag();
      return;
    }
    
    if (!modoCaptura) return;
    
    if (marcadorTemp) mapInstance.removeLayer(marcadorTemp);
    
    const tempIcon = L.divIcon({
      html: `<div style="width: 24px; height: 24px; background: #ff0000; border: 3px solid white; border-radius: 50%;"></div>`,
      iconSize: [24, 24]
    });
    marcadorTemp = L.marker(e.latlng, { icon: tempIcon }).addTo(mapInstance);
    
    const coords = getNormalizedCoords(e.latlng);
    
    editandoId = null;
    imagensTemp = [];
    botoesTemp = [];
    document.getElementById('modalX').value = coords.x;
    document.getElementById('modalY').value = coords.y;
    document.getElementById('modalNome').value = '';
    document.getElementById('modalLote').value = '';
    document.getElementById('modalQuadra').value = '';
    document.getElementById('modalTipo').value = '';
    document.getElementById('modalDetalhe').value = '';
    document.getElementById('modalTestada').value = '';
    document.getElementById('modalAreaTotal').value = '';
    document.getElementById('modalDescricao').value = '';
    document.getElementById('modalCor').value = '#d4af37';
    atualizarListaImagens();
    atualizarListaBotoes();
    document.getElementById('modalForm').style.display = 'block';
    
    if (marcadorTemp) mapInstance.removeLayer(marcadorTemp);
  });
}

function getNormalizedCoords(latLng) {
  const x = (latLng.lng - bounds.getWest()) / (bounds.getEast() - bounds.getWest());
  const y = (latLng.lat - bounds.getSouth()) / (bounds.getNorth() - bounds.getSouth());
  return { 
    x: Math.round(x * 10000) / 10000, 
    y: Math.round(y * 10000) / 10000 
  };
}

function getLatLngFromCoords(x, y) {
  const lng = bounds.getWest() + (x * (bounds.getEast() - bounds.getWest()));
  const lat = bounds.getSouth() + (y * (bounds.getNorth() - bounds.getSouth()));
  return { lat, lng };
}

function addMarkerToMap(x, y, ponto) {
  if (!mapInstance) return;
  
  const { lat, lng } = getLatLngFromCoords(x, y);
  
  const icon = L.divIcon({
    html: `<div style="width: 20px; height: 20px; background: ${ponto.cor || '#d4af37'}; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 5px black; cursor: pointer;"></div>`,
    iconSize: [20, 20]
  });
  
  const marker = L.marker([lat, lng], { icon: icon, draggable: false }).addTo(mapInstance);
  marker.bindPopup(`<b>${ponto.nome}</b><br>X: ${x.toFixed(4)} | Y: ${y.toFixed(4)}`);
  marker.on('click', () => abrirEditor(ponto.id));
  
  mapMarkers[ponto.id] = marker;
  return marker;
}

function atualizarPosicaoMarker(id, novaX, novaY) {
  if (mapMarkers[id]) {
    const { lat, lng } = getLatLngFromCoords(novaX, novaY);
    mapMarkers[id].setLatLng([lat, lng]);
    const ponto = pontos.find(p => p.id === id);
    if (ponto) {
      mapMarkers[id].bindPopup(`<b>${ponto.nome}</b><br>X: ${novaX.toFixed(4)} | Y: ${novaY.toFixed(4)}`);
    }
  }
}

function iniciarDrag(ponto) {
  if (dragMarker) {
    mapInstance.removeLayer(dragMarker);
  }
  
  modoDrag = true;
  pontoEmEdicao = ponto;
  
  const { lat, lng } = getLatLngFromCoords(ponto.x, ponto.y);
  
  const dragIcon = L.divIcon({
    html: `<div style="width: 32px; height: 32px; background: #ff5722; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 15px rgba(255,87,34,0.8); cursor: move; display: flex; align-items: center; justify-content: center; font-size: 16px;">✚</div>`,
    iconSize: [32, 32]
  });
  
  dragMarker = L.marker([lat, lng], { icon: dragIcon, draggable: true }).addTo(mapInstance);
  
  dragMarker.on('drag', function(e) {
    const pos = e.target.getLatLng();
    const coords = getNormalizedCoords(pos);
    document.getElementById('controlPanel').innerHTML = `🟠 Movendo: X=${coords.x.toFixed(4)} | Y=${coords.y.toFixed(4)}`;
  });
  
  dragMarker.on('dragend', function(e) {
    const pos = e.target.getLatLng();
    const novasCoords = getNormalizedCoords(pos);
    
    ponto.x = novasCoords.x;
    ponto.y = novasCoords.y;
    
    atualizarPosicaoMarker(ponto.id, ponto.x, ponto.y);
    atualizarLista();
    
    showNotification(`✅ Posição atualizada!\nX: ${ponto.x.toFixed(4)}\nY: ${ponto.y.toFixed(4)}`);
    
    mapInstance.removeLayer(dragMarker);
    dragMarker = null;
    modoDrag = false;
    pontoEmEdicao = null;
    document.getElementById('controlPanel').innerHTML = '📍 Movimentação finalizada com precisão';
    
    setTimeout(() => {
      document.getElementById('controlPanel').innerHTML = modoCaptura ? '🔴 Modo captura ATIVO - Clique no mapa' : '📍 Clique em ATIVAR CAPTURA';
    }, 2000);
  });
  
  dragMarker.openPopup();
  showNotification(`🟠 Arraste o marcador para a posição exata e solte\nPrecisão: 4 casas decimais`);
}

function duplicarPonto(id) {
  const pontoOriginal = pontos.find(p => p.id === id);
  if (!pontoOriginal) return;
  
  const novoPonto = {
    id: Date.now(),
    x: pontoOriginal.x,
    y: pontoOriginal.y,
    nome: `${pontoOriginal.nome} (cópia)`,
    lote: pontoOriginal.lote || '',
    quadra: pontoOriginal.quadra || '',
    tipo: pontoOriginal.tipo || '',
    detalhe: pontoOriginal.detalhe || '',
    testada: pontoOriginal.testada || '',
    areaTotal: pontoOriginal.areaTotal || '',
    descricaoDetalhada: pontoOriginal.descricaoDetalhada || '',
    cor: pontoOriginal.cor || '#d4af37',
    imagens: pontoOriginal.imagens ? [...pontoOriginal.imagens] : [],
    botoes: pontoOriginal.botoes ? [...pontoOriginal.botoes] : []
  };
  
  pontos.push(novoPonto);
  addMarkerToMap(novoPonto.x, novoPonto.y, novoPonto);
  atualizarLista();
  
  showNotification(`✅ Ponto duplicado!\n${pontoOriginal.nome} → ${novoPonto.nome}\nImagens: ${novoPonto.imagens.length}\nBotões: ${novoPonto.botoes.length}`);
}

function cancelarDrag() {
  if (dragMarker) {
    mapInstance.removeLayer(dragMarker);
    dragMarker = null;
  }
  modoDrag = false;
  pontoEmEdicao = null;
  document.getElementById('controlPanel').innerHTML = '📍 Movimentação cancelada';
}

function atualizarLista() {
  const container = document.getElementById('pointsContainer');
  const listDiv = document.getElementById('pointsList');
  
  if (pontos.length > 0) {
    listDiv.style.display = 'block';
    container.innerHTML = pontos.map(p => `
      <div class="point-item">
        <div class="point-name">📍 ${escapeHtml(p.nome)}</div>
        <div class="point-coords">X: ${p.x.toFixed(4)} | Y: ${p.y.toFixed(4)} | 📷 ${p.imagens ? p.imagens.length : 0} img | 🔗 ${p.botoes ? p.botoes.length : 0} btn</div>
        <div class="point-actions">
          <button class="edit-point" onclick="abrirEditor(${p.id})">✏️ Editar</button>
          <button class="drag-point ${modoDrag && pontoEmEdicao?.id === p.id ? 'ativo' : ''}" onclick="iniciarDrag(pontos.find(pt => pt.id === ${p.id}))">🖱️ Mover</button>
          <button class="duplicate-point" onclick="duplicarPonto(${p.id})">📋 Duplicar</button>
          <button class="delete-point" onclick="deletarPonto(${p.id})">🗑️ Excluir</button>
        </div>
      </div>
    `).join('');
  } else {
    listDiv.style.display = 'none';
  }
}

function deletarPonto(id) {
  if (confirm('Tem certeza que deseja excluir este ponto?')) {
    const index = pontos.findIndex(p => p.id === id);
    if (index !== -1) {
      pontos.splice(index, 1);
      if (mapMarkers[id]) {
        mapInstance.removeLayer(mapMarkers[id]);
        delete mapMarkers[id];
      }
      atualizarLista();
      showNotification('✅ Ponto excluído!');
    }
  }
}

function abrirEditor(id) {
  const ponto = pontos.find(p => p.id === id);
  if (!ponto) return;
  
  editandoId = id;
  document.getElementById('modalX').value = ponto.x;
  document.getElementById('modalY').value = ponto.y;
  document.getElementById('modalNome').value = ponto.nome || '';
  document.getElementById('modalLote').value = ponto.lote || '';
  document.getElementById('modalQuadra').value = ponto.quadra || '';
  document.getElementById('modalTipo').value = ponto.tipo || '';
  document.getElementById('modalDetalhe').value = ponto.detalhe || '';
  document.getElementById('modalTestada').value = ponto.testada || '';
  document.getElementById('modalAreaTotal').value = ponto.areaTotal || '';
  document.getElementById('modalDescricao').value = ponto.descricaoDetalhada || '';
  document.getElementById('modalCor').value = ponto.cor || '#d4af37';
  
  imagensTemp = ponto.imagens ? [...ponto.imagens] : [];
  botoesTemp = ponto.botoes ? [...ponto.botoes] : [];
  atualizarListaImagens();
  atualizarListaBotoes();
  
  document.getElementById('modalForm').style.display = 'block';
}

// Funções para IMAGENS
function atualizarListaImagens() {
  const container = document.getElementById('imagensContainer');
  
  container.innerHTML = '';
  imagensTemp.forEach((img, index) => {
    const div = document.createElement('div');
    div.className = 'image-input-group';
    div.innerHTML = `
      <input type="text" value="${escapeHtml(img)}" placeholder="URL da imagem" onchange="imagensTemp[${index}] = this.value; atualizarPreview()">
      <button class="remove-image-btn" onclick="removerImagem(${index})">🗑️</button>
    `;
    container.appendChild(div);
  });
  
  atualizarPreview();
}

function atualizarPreview() {
  const preview = document.getElementById('imagePreview');
  preview.innerHTML = '';
  imagensTemp.forEach(img => {
    if (img && img.trim() !== '') {
      const imgElement = document.createElement('img');
      imgElement.src = img;
      imgElement.onerror = () => { imgElement.style.opacity = '0.5'; };
      preview.appendChild(imgElement);
    }
  });
}

function adicionarImagem() {
  imagensTemp.push('');
  atualizarListaImagens();
}

function removerImagem(index) {
  imagensTemp.splice(index, 1);
  atualizarListaImagens();
}

// Funções para BOTÕES
function atualizarListaBotoes() {
  const container = document.getElementById('botoesContainer');
  
  container.innerHTML = '';
  botoesTemp.forEach((btn, index) => {
    const div = document.createElement('div');
    div.className = 'button-input-group';
    div.innerHTML = `
      <input type="text" value="${escapeHtml(btn.texto)}" placeholder="Texto do botão (ex: Website)" onchange="botoesTemp[${index}].texto = this.value; atualizarPreviewBotoes()">
      <input type="text" value="${escapeHtml(btn.link)}" placeholder="URL do link (ex: https://...)" onchange="botoesTemp[${index}].link = this.value; atualizarPreviewBotoes()">
      <button class="remove-button-btn" onclick="removerBotao(${index})">🗑️</button>
    `;
    container.appendChild(div);
  });
  
  atualizarPreviewBotoes();
}

function atualizarPreviewBotoes() {
  const preview = document.getElementById('buttonPreview');
  preview.innerHTML = '';
  botoesTemp.forEach(btn => {
    if (btn.texto && btn.texto.trim() !== '') {
      const previewBtn = document.createElement('div');
      previewBtn.className = 'preview-btn';
      previewBtn.innerHTML = `🔗 ${escapeHtml(btn.texto)}`;
      preview.appendChild(previewBtn);
    }
  });
}

function adicionarBotao() {
  botoesTemp.push({ texto: '', link: '' });
  atualizarListaBotoes();
}

function removerBotao(index) {
  botoesTemp.splice(index, 1);
  atualizarListaBotoes();
}

function salvarPonto(dados) {
  if (!dados.nome || dados.nome.trim() === '') {
    alert('O campo NOME é obrigatório!');
    return;
  }
  
  const x = parseFloat(dados.x);
  const y = parseFloat(dados.y);
  
  if (editandoId) {
    const index = pontos.findIndex(p => p.id === editandoId);
    if (index !== -1) {
      pontos[index] = { 
        ...pontos[index], 
        x: x,
        y: y,
        nome: dados.nome, 
        lote: dados.lote, 
        quadra: dados.quadra, 
        tipo: dados.tipo, 
        detalhe: dados.detalhe, 
        testada: dados.testada, 
        areaTotal: dados.areaTotal, 
        descricaoDetalhada: dados.descricaoDetalhada, 
        cor: dados.cor,
        imagens: [...imagensTemp],
        botoes: [...botoesTemp],
        id: editandoId 
      };
      if (mapMarkers[editandoId]) {
        mapInstance.removeLayer(mapMarkers[editandoId]);
      }
      addMarkerToMap(x, y, pontos[index]);
    }
    editandoId = null;
    showNotification(`✏️ Ponto atualizado!\nImagens: ${imagensTemp.length}\nBotões: ${botoesTemp.length}`);
  } else {
    const novoId = Date.now();
    const novoPonto = {
      id: novoId,
      x: x,
      y: y,
      nome: dados.nome,
      lote: dados.lote || '',
      quadra: dados.quadra || '',
      tipo: dados.tipo || '',
      detalhe: dados.detalhe || '',
      testada: dados.testada || '',
      areaTotal: dados.areaTotal || '',
      descricaoDetalhada: dados.descricaoDetalhada || '',
      cor: dados.cor || '#d4af37',
      imagens: [...imagensTemp],
      botoes: [...botoesTemp]
    };
    pontos.push(novoPonto);
    addMarkerToMap(x, y, novoPonto);
    showNotification(`✅ Ponto adicionado!\nImagens: ${imagensTemp.length}\nBotões: ${botoesTemp.length}`);
  }
  
  imagensTemp = [];
  botoesTemp = [];
  atualizarLista();
  document.getElementById('modalForm').style.display = 'none';
}

function carregarXML(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const xmlText = e.target.result;
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, 'application/xml');
    const marcadores = xml.querySelectorAll('marcador');
    
    pontos.forEach(p => {
      if (mapMarkers[p.id]) mapInstance.removeLayer(mapMarkers[p.id]);
    });
    pontos = [];
    
    marcadores.forEach(marcador => {
      const imagens = [];
      const imagensNodes = marcador.querySelectorAll('imagem');
      imagensNodes.forEach(img => {
        const url = img.textContent;
        if (url && url.trim() !== '') imagens.push(url);
      });
      
      const botoes = [];
      const botoesNodes = marcador.querySelectorAll('botao');
      botoesNodes.forEach(btn => {
        const texto = btn.querySelector('texto')?.textContent || '';
        const link = btn.querySelector('link')?.textContent || '';
        if (texto && link) botoes.push({ texto, link });
      });
      
      const dados = {
        id: parseInt(marcador.getAttribute('id')) || Date.now() + Math.random(),
        x: parseFloat(marcador.querySelector('x')?.textContent || 0),
        y: parseFloat(marcador.querySelector('y')?.textContent || 0),
        nome: marcador.querySelector('nome')?.textContent || '',
        lote: marcador.querySelector('lote')?.textContent || '',
        quadra: marcador.querySelector('quadra')?.textContent || '',
        tipo: marcador.querySelector('tipo')?.textContent || '',
        detalhe: marcador.querySelector('detalhe')?.textContent || '',
        testada: marcador.querySelector('testada')?.textContent || '',
        areaTotal: marcador.querySelector('areaTotal')?.textContent || '',
        descricaoDetalhada: marcador.querySelector('descricaoDetalhada')?.textContent || '',
        cor: marcador.querySelector('cor')?.textContent || '#d4af37',
        imagens: imagens,
        botoes: botoes
      };
      
      if (!isNaN(dados.x) && !isNaN(dados.y) && dados.nome) {
        pontos.push(dados);
        addMarkerToMap(dados.x, dados.y, dados);
      }
    });
    
    atualizarLista();
    const totalBotoes = pontos.reduce((acc, p) => acc + (p.botoes?.length || 0), 0);
    showNotification(`✅ ${marcadores.length} pontos carregados!\nImagens: ${pontos.reduce((acc, p) => acc + (p.imagens?.length || 0), 0)}\nBotões: ${totalBotoes}`);
  };
  reader.readAsText(file);
}

function salvarXML() {
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<marcadores>\n';
  pontos.forEach(p => {
    xml += `  <marcador id="${p.id}">\n`;
    xml += `    <x>${p.x.toFixed(4)}</x>\n    <y>${p.y.toFixed(4)}</y>\n`;
    xml += `    <nome>${escapeXml(p.nome)}</nome>\n`;
    xml += `    <lote>${escapeXml(p.lote || '')}</lote>\n`;
    xml += `    <quadra>${escapeXml(p.quadra || '')}</quadra>\n`;
    xml += `    <tipo>${escapeXml(p.tipo || '')}</tipo>\n`;
    xml += `    <detalhe>${escapeXml(p.detalhe || '')}</detalhe>\n`;
    xml += `    <testada>${escapeXml(p.testada || '')}</testada>\n`;
    xml += `    <areaTotal>${escapeXml(p.areaTotal || '')}</areaTotal>\n`;
    xml += `    <descricaoDetalhada>${escapeXml(p.descricaoDetalhada || '')}</descricaoDetalhada>\n`;
    xml += `    <cor>${p.cor || '#d4af37'}</cor>\n`;
    if (p.imagens && p.imagens.length > 0) {
      p.imagens.forEach(img => {
        xml += `    <imagem>${escapeXml(img)}</imagem>\n`;
      });
    }
    if (p.botoes && p.botoes.length > 0) {
      p.botoes.forEach(btn => {
        xml += `    <botao>\n`;
        xml += `      <texto>${escapeXml(btn.texto)}</texto>\n`;
        xml += `      <link>${escapeXml(btn.link)}</link>\n`;
        xml += `    </botao>\n`;
      });
    }
    xml += `  </marcador>\n`;
  });
  xml += '</marcadores>';
  
  const blob = new Blob([xml], { type: 'application/xml' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'marcadores.xml';
  link.click();
  const totalBotoes = pontos.reduce((acc, p) => acc + (p.botoes?.length || 0), 0);
  showNotification(`💾 ${pontos.length} pontos salvos!\nImagens: ${pontos.reduce((acc, p) => acc + (p.imagens?.length || 0), 0)}\nBotões: ${totalBotoes}`);
}

function escapeXml(str) {
  if (!str) return '';
  return str.replace(/[<>&]/g, function(m) {
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '&') return '&amp;';
    return m;
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

});
